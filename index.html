<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Station.</title><style>*{box-sizing:border-box}body{background:#171717;font:14px Arial;margin:0;padding:24px 10px;color:#111}.window{max-width:850px;margin:auto;background:#c0c0c0;border:3px outset white;box-shadow:5px 5px #00000080}.bar{background:linear-gradient(90deg,navy,#4789bb);color:white;padding:6px;font-weight:bold}.menu,.address,.status{padding:8px;font-size:12px}.address span{display:inline-block;background:white;border:2px inset #ddd;padding:5px;width:80%}main{background:white;border:2px inset #ddd;padding:24px;min-height:450px}h1{font:bold 44px 'Courier New',monospace;letter-spacing:-2px;margin:0}h2,h3{font-family:'Courier New',monospace}.tag{font:11px 'Courier New';letter-spacing:2px}button{background:#c0c0c0;border:2px outset white;padding:8px;cursor:pointer;color:black}button:active{border-style:inset}input,select{padding:8px;border:2px inset #ddd;background:white;color:black;max-width:100%}label{display:block;margin:12px 0 4px}form{max-width:340px;margin:24px auto}form input{width:100%}fieldset{padding:16px}nav{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0}.banner{background:black;color:white;padding:20px;font-family:'Courier New',monospace}.item{border:1px solid #aaa;padding:12px;margin:10px 0}.item button{margin-top:8px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.product{border:1px solid #aaa;padding:12px}.art{background:#111;color:white;padding:35px 4px;text-align:center;font:bold 15px 'Courier New'}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#333}a{color:navy}footer{font:11px 'Courier New';margin-top:30px;color:#666}[hidden]{display:none!important}body{min-height:100vh;background:#171717;isolation:isolate}.window{position:relative;z-index:1}.background-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.6 html,body{margin:0;padding:0;width:100%;min-height:100%;background:#c0c0c0}

</style><video class="background-video" id="backgroundVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="kettlebell.mp4" type="video/mp4"></video><button class="video-toggle" id="videoToggle" type="button">Pause background</button><script>const v=document.getElementById('backgroundVideo'),bt=document.getElementById('videoToggle');if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.pause();bt.hidden=true}bt.onclick=()=>{if(v.paused){v.play().then(()=>bt.textContent='Pause background').catch(()=>bt.textContent='Video unavailable')}else{v.pause();bt.textContent='Play background'}};v.addEventListener('error',()=>bt.hidden=true,true);</script><div class="window"><div class="bar">▣ The Station. — Microsoft Internet Explorer <span style="float:right">_ □ ×</span></div><div class="menu">File　 Edit　 View　 Favorites　 Tools　 Help</div><div class="address">Address　<span id="address">/login</span></div><main><h1>The Station.</h1><div class="tag" id="tagline">TRAIN. CONNECT. COMPETE.</div><section id="auth"><form id="authform"><fieldset><legend id="legend">Member authentication</legend><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password" id="pwlabel">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><p><button id="submit">Log in →</button></p></fieldset><p><button type="button" data-mode="login">Log in</button> <button type="button" data-mode="signup">Register</button> <button type="button" data-mode="reset">Forgot password?</button></p></form></section><section id="members" hidden><nav><button data-tab="home">Home</button><button data-tab="events">Events</button><button data-tab="rank">Leaderboard</button><button data-tab="clothing">Clothing</button><button data-tab="profile">My Profile</button><button data-tab="admin" id="adminTab" hidden>Admin</button><button id="logout">Log out</button></nav><div id="panel"></div></section><p id="message" role="status"></p><footer>THE STATION NETWORK © 2026</footer></main><div class="status">▣ The Station. / Member network</div></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://rmcxwohdavmxwlgfmopy.supabase.co','sb_publishable_guh28en0UYS0aEg0Y52MTw_5f4_msCQ');
let products=[],settings={},admin=false,view=0;const $=id=>document.getElementById(id), msg=t=>$('message').textContent=t;let mode='login',user=null,recovering=false,bag=[];const redirect=location.origin+location.pathname;
function setMode(m){mode=m;$('legend').textContent={login:'Member authentication',signup:'Create member account',reset:'Password recovery',update:'Choose new password'}[m];$('submit').textContent={login:'Log in →',signup:'Register',reset:'Send reset email',update:'Save password'}[m];$('email').hidden=m==='update';$('email').required=m!=='update';$('password').hidden=$('pwlabel').hidden=m==='reset';$('password').required=m!=='reset';$('password').autocomplete=m==='login'?'current-password':'new-password';$('password').value='';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(!recovering)setMode(b.dataset.mode)});
$('authform').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('Connecting…');try{let r;const email=$('email').value,password=$('password').value;if(mode==='login')r=await db.auth.signInWithPassword({email,password});if(mode==='signup')r=await db.auth.signUp({email,password,options:{emailRedirectTo:redirect}});if(mode==='reset')r=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(mode==='update')r=await db.auth.updateUser({password});if(r.error)throw r.error;if(mode==='signup')msg('Check your email to confirm your account.');else if(mode==='reset')msg('If the account exists, a reset email will be sent.');else if(mode==='update'){recovering=false;await db.auth.signOut();setMode('login');msg('Password updated. Log in again.');}else msg('');}catch(e){msg(e.message)}finally{$('submit').disabled=false}};
function session(s){user=s?.user||null;admin=false;view++;$('auth').hidden=!!user&&!recovering;$('members').hidden=!user||recovering;$('adminTab').hidden=true;if(user&&!recovering){setTimeout(()=>{checkAdmin();show('home')},0)}else $('address').textContent='/login';}
db.auth.onAuthStateChange((event,s)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setMode('update')}session(s)});$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)msg(error.message);else{bag=[];setMode('login');msg('Logged out.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function events(){const p=$('panel');const [a,b]=await Promise.all([db.from('events').select('*').order('starts_at'),db.from('registrations').select('event_id').eq('user_id',user.id)]);if(a.error||b.error){p.insertAdjacentHTML('beforeend','<p>Events unavailable. Run the database setup SQL.</p>');return}const joined=new Set(b.data.map(x=>x.event_id));p.insertAdjacentHTML('beforeend',a.data.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.description)}</p><p>${esc(new Date(x.starts_at).toLocaleString())} · ${esc(x.location)}</p><button data-event="${esc(x.id)}">${joined.has(x.id)?'Cancel registration':'Join event'}</button></div>`).join('')||'<p>No upcoming events listed.</p>');p.querySelectorAll('[data-event]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const id=btn.dataset.event;const r=joined.has(id)?await db.from('registrations').delete().eq('event_id',id).eq('user_id',user.id):await db.from('registrations').insert({event_id:id,user_id:user.id});if(r.error){msg(r.error.message);btn.disabled=false}else show('events')})}

async function show(tab){if(!user||recovering)return;const token=++view;msg('');$('address').textContent='/members/'+tab;const p=$('panel');if(tab==='admin'){if(!admin){p.textContent='Access denied';return}return adminPanel()}if(tab==='home'||tab==='events'){p.innerHTML=(tab==='home'?'<div class="banner"><small>SYSTEM MESSAGE // 001</small><h2>Welcome to The Station.</h2>'+esc(settings.welcome||'Built for those who show up.')+'<p>'+esc(settings.announcement||'')+'</p></div>':'')+'<h2>Upcoming sessions_</h2>';await events()}if(tab==='rank'){p.innerHTML='<h2>Station rankings_</h2>';const r=await db.from('leaderboard').select('*').order('points',{ascending:false});if($('address').textContent!='/members/rank')return;p.insertAdjacentHTML('beforeend',r.error?'<p>Leaderboard unavailable.</p>':r.data.map((x,i)=>`<div class="item">${i+1}. ${esc(x.display_name)} — ${esc(x.points)} points</div>`).join('')||'<p>No results yet.</p>')}if(tab==='profile'){p.innerHTML='<h2>Member file_</h2><div class="banner">MEMBER ACCESS GRANTED<p>'+esc(user.email)+'</p></div><form id="profileform"><label>Display name</label><input id="displayname" maxlength="60" required><p><button>Save profile</button></p></form>';const r=await db.from('profiles').select('display_name').eq('id',user.id).maybeSingle();if(!$('displayname'))return;$('displayname').value=r.data?.display_name||'';$('profileform').onsubmit=async e=>{e.preventDefault();const r=await db.from('profiles').upsert({id:user.id,display_name:$('displayname').value});msg(r.error?r.error.message:'Profile saved.')}}if(tab==='clothing'){p.textContent='Loading clothing…';const r=await db.from('products').select('*').order('name');if(token!==view)return;if(r.error){p.textContent=r.error.message;return}products=r.data;p.innerHTML='<div class="banner"><h2>The Station. Uniform</h2>MEMBERS COLLECTION / VOL. 01</div><h2>Clothing directory_</h2><div class="products">'+products.map(x=>`<div class="product">${safeUrl(x.image_url)?`<img style="width:100%;height:150px;object-fit:cover" src="${esc(safeUrl(x.image_url))}" alt="${esc(x.name)}">`:'<div class="art">The Station.</div>'}<h3>${esc(x.name)}</h3><p>$${esc(x.price)} AUD · ${esc(x.stock)} in stock</p><select aria-label="Size">${esc(x.sizes).split(',').map(z=>`<option>${z.trim()}</option>`).join('')}</select> <button data-add="${esc(x.id)}" ${x.stock<=0?'disabled':''}>Add to bag</button></div>`).join('')+'</div><h3>Shopping bag_</h3><div id="bag"></div><p>Checkout not connected.</p>';p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const x=products.find(z=>z.id===b.dataset.add);if(x&&bag.filter(z=>z.id===x.id).length<x.stock){bag.push({id:x.id,name:x.name,price:Number(x.price),size:b.previousElementSibling.value});renderBag()}});renderBag()}}
function renderBag(){ $('bag').innerHTML=bag.map((x,i)=>`<p>${esc(x.name)} / ${esc(x.size)} — $${esc(x.price)} <button data-remove="${i}">Remove</button></p>`).join('')+`<b>Total: $${bag.reduce((s,x)=>s+x.price,0).toFixed(2)} AUD</b>`;$('bag').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{bag.splice(+b.dataset.remove,1);renderBag()})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));

function safeUrl(v){try{const u=new URL(v,location.href);return u.protocol==='https:'|| (u.origin===location.origin&&u.protocol==='http:')?u.href:''}catch{return ''}}
async function checkAdmin(){const id=user?.id;admin=false;const r=await db.rpc('station_is_admin');if(user?.id!==id)return;admin=r.data===true;$('adminTab').hidden=!admin;}
async function loadSettings(){const r=await db.from('site_settings').select('*').eq('id',1).maybeSingle();if(r.error||!r.data)return;settings=r.data;$('tagline').textContent=settings.tagline;const url=safeUrl(settings.video_url||'kettlebell.mp4');if(url&&v.currentSrc!==url){v.src=url;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)v.play().catch(()=>{})}}
loadSettings();
const schemas={events:[['title','Title'],['description','Description'],['starts_at','Start date and time','datetime-local'],['location','Location']],products:[['name','Product name'],['price','Price AUD','number'],['stock','Stock','number'],['sizes','Sizes (comma separated)'],['image_url','Image URL','url']],leaderboard:[['display_name','Member name'],['points','Points','number']],site_settings:[['tagline','Tagline'],['welcome','Welcome message'],['announcement','Announcement'],['video_url','Video URL or repository filename']]};
let adminSection='site_settings';
async function adminPanel(){const p=$('panel'),t=adminSection;const stamp=++view;p.innerHTML='<div class="banner"><h2>Admin control panel_</h2>OWNER ACCESS / CONTENT MANAGEMENT</div><nav>'+Object.entries({site_settings:'Website settings',events:'Events',products:'Clothing',leaderboard:'Leaderboard',members:'Members'}).map(([k,n])=>`<button data-manage="${k}">${n}</button>`).join('')+'</nav><div id="adminContent">Loading…</div>';p.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{adminSection=b.dataset.manage;adminPanel()});const r=t==='members'?await db.rpc('station_members'):await db.from(t).select('*');if(stamp!==view||!admin)return;const c=$('adminContent');if(r.error){c.textContent=r.error.message;return}if(t==='members'){c.innerHTML='<h3>Registered accounts ('+r.data.length+')</h3>'+r.data.map(x=>`<div class="item">${esc(x.email)} · ${esc(x.display_name||'No profile')}<p>Joined ${esc(new Date(x.created_at).toLocaleDateString())}</p></div>`).join('');return}const fields=schemas[t];const rows=r.data;c.innerHTML='<h3>'+esc(t.replace('_',' '))+'</h3><div id="editList"></div><form id="adminForm"><h3 id="editTitle">'+(t==='site_settings'?'Edit website':'Add new')+'</h3>'+fields.map(([k,l,type])=>`<label for="field_${k}">${l}</label><input id="field_${k}" type="${type||'text'}" ${type==='number'?'step="'+(k==='price'?'0.01':'1')+'" min="0"':''} ${['description','location','image_url','announcement'].includes(k)?'':'required'}>`).join('')+'<p><button>Save changes</button> <button type="button" id="newEntry">Clear / new</button></p></form>';let editing=null;const form=$('adminForm');function edit(x){editing=x?.id??null;fields.forEach(([k,l,type])=>{let val=x?.[k]??(k==='sizes'?'S,M,L,XL':k==='stock'||k==='points'?0:'');if(type==='datetime-local'&&val){const d=new Date(val);val=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('field_'+k).value=val});$('editTitle').textContent=editing?'Edit entry':'Add new'}if(t==='site_settings'){edit(rows[0]||{id:1});$('newEntry').hidden=true}else{$('editList').innerHTML=rows.map((x,i)=>`<div class="item"><b>${esc(x.title||x.name||x.display_name)}</b> <button data-edit="${i}">Edit</button> <button data-delete="${i}">Delete</button></div>`).join('');$('editList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(rows[+b.dataset.edit]));$('editList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this entry? Event deletion also removes registrations.'))return;const q=await db.from(t).delete().eq('id',rows[+b.dataset.delete].id);if(q.error)msg(q.error.message);else adminPanel()});$('newEntry').onclick=()=>edit(null);edit(null)}form.onsubmit=async e=>{e.preventDefault();const data={};for(const [k,l,type] of fields){let val=$('field_'+k).value;if(type==='number')val=Number(val);if(type==='datetime-local')val=new Date(val).toISOString();data[k]=val}if(data.video_url&&!safeUrl(data.video_url)){msg('Use a valid HTTPS video URL or local filename.');return}const q=editing!==null?await db.from(t).update(data).eq('id',editing):await db.from(t).insert(data);if(q.error){msg(q.error.message);return}if(t==='site_settings')await loadSettings();msg('Saved successfully.');adminPanel()}}
</script></html>
