<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Station.</title><style>*{box-sizing:border-box}body{background:#171717;font:14px Arial;margin:0;padding:24px 10px;color:#111}.window{max-width:850px;margin:auto;background:#c0c0c0;border:3px outset white;box-shadow:5px 5px #00000080}.bar{background:linear-gradient(90deg,navy,#4789bb);color:white;padding:6px;font-weight:bold}.menu,.address,.status{padding:8px;font-size:12px}.address span{display:inline-block;background:white;border:2px inset #ddd;padding:5px;width:80%}main{background:white;border:2px inset #ddd;padding:24px;min-height:450px}h1{font:bold 44px 'Courier New',monospace;letter-spacing:-2px;margin:0}h2,h3{font-family:'Courier New',monospace}.tag{font:11px 'Courier New';letter-spacing:2px}button{background:#c0c0c0;border:2px outset white;padding:8px;cursor:pointer;color:black}button:active{border-style:inset}input,select{padding:8px;border:2px inset #ddd;background:white;color:black;max-width:100%}label{display:block;margin:12px 0 4px}form{max-width:340px;margin:24px auto}form input{width:100%}fieldset{padding:16px}nav{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0}.banner{background:black;color:white;padding:20px;font-family:'Courier New',monospace}.item{border:1px solid #aaa;padding:12px;margin:10px 0}.item button{margin-top:8px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.product{border:1px solid #aaa;padding:12px}.art{background:#111;color:white;padding:35px 4px;text-align:center;font:bold 15px 'Courier New'}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#333}a{color:navy}footer{font:11px 'Courier New';margin-top:30px;color:#666}[hidden]{display:none!important}body{min-height:100vh;background:#171717;isolation:isolate}.window{position:relative;z-index:1}.background-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.65);z-index:-1;pointer-events:none}.video-toggle{position:fixed;bottom:12px;right:12px;z-index:2}@media(prefers-reduced-motion:reduce){.background-video{display:none}}html{background:#171717}.background-video{inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px)}</style><video class="background-video" id="backgroundVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="kettlebell.mp4" type="video/mp4"></video><button class="video-toggle" id="videoToggle" type="button">Pause background</button><script>const v=document.getElementById('backgroundVideo'),bt=document.getElementById('videoToggle');if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.pause();bt.hidden=true}bt.onclick=()=>{if(v.paused){v.play().then(()=>bt.textContent='Pause background').catch(()=>bt.textContent='Video unavailable')}else{v.pause();bt.textContent='Play background'}};v.addEventListener('error',()=>bt.hidden=true,true);</script><div class="window"><div class="bar">▣ The Station. — Microsoft Internet Explorer <span style="float:right">_ □ ×</span></div><div class="menu">File　 Edit　 View　 Favorites　 Tools　 Help</div><div class="address">Address　<span id="address">/login</span></div><main><h1>The Station.</h1><div class="tag">TRAIN. CONNECT. COMPETE.</div><section id="auth"><form id="authform"><fieldset><legend id="legend">Member authentication</legend><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password" id="pwlabel">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><p><button id="submit">Log in →</button></p></fieldset><p><button type="button" data-mode="login">Log in</button> <button type="button" data-mode="signup">Register</button> <button type="button" data-mode="reset">Forgot password?</button></p></form></section><section id="members" hidden><nav><button data-tab="home">Home</button><button data-tab="events">Events</button><button data-tab="rank">Leaderboard</button><button data-tab="clothing">Clothing</button><button data-tab="profile">My Profile</button><button id="logout">Log out</button></nav><div id="panel"></div></section><p id="message" role="status"></p><footer>THE STATION NETWORK © 2026</footer></main><div class="status">▣ The Station. / Member network</div></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://rmcxwohdavmxwlgfmopy.supabase.co','sb_publishable_guh28en0UYS0aEg0Y52MTw_5f4_msCQ');
const $=id=>document.getElementById(id), msg=t=>$('message').textContent=t;let mode='login',user=null,recovering=false,bag=[];const redirect=location.origin+location.pathname;
function setMode(m){mode=m;$('legend').textContent={login:'Member authentication',signup:'Create member account',reset:'Password recovery',update:'Choose new password'}[m];$('submit').textContent={login:'Log in →',signup:'Register',reset:'Send reset email',update:'Save password'}[m];$('email').hidden=m==='update';$('email').required=m!=='update';$('password').hidden=$('pwlabel').hidden=m==='reset';$('password').required=m!=='reset';$('password').autocomplete=m==='login'?'current-password':'new-password';$('password').value='';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(!recovering)setMode(b.dataset.mode)});
$('authform').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('Connecting…');try{let r;const email=$('email').value,password=$('password').value;if(mode==='login')r=await db.auth.signInWithPassword({email,password});if(mode==='signup')r=await db.auth.signUp({email,password,options:{emailRedirectTo:redirect}});if(mode==='reset')r=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(mode==='update')r=await db.auth.updateUser({password});if(r.error)throw r.error;if(mode==='signup')msg('Check your email to confirm your account.');else if(mode==='reset')msg('If the account exists, a reset email will be sent.');else if(mode==='update'){recovering=false;await db.auth.signOut();setMode('login');msg('Password updated. Log in again.');}else msg('');}catch(e){msg(e.message)}finally{$('submit').disabled=false}};
function session(s){user=s?.user||null;$('auth').hidden=!!user&&!recovering;$('members').hidden=!user||recovering;if(user&&!recovering)show('home');else $('address').textContent='/login';}
db.auth.onAuthStateChange((event,s)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setMode('update')}session(s)});$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)msg(error.message);else{bag=[];setMode('login');msg('Logged out.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function events(){const p=$('panel');const [a,b]=await Promise.all([db.from('events').select('*').order('starts_at'),db.from('registrations').select('event_id').eq('user_id',user.id)]);if(a.error||b.error){p.insertAdjacentHTML('beforeend','<p>Events unavailable. Run the database setup SQL.</p>');return}const joined=new Set(b.data.map(x=>x.event_id));p.insertAdjacentHTML('beforeend',a.data.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.description)}</p><p>${esc(new Date(x.starts_at).toLocaleString())} · ${esc(x.location)}</p><button data-event="${esc(x.id)}">${joined.has(x.id)?'Cancel registration':'Join event'}</button></div>`).join('')||'<p>No upcoming events listed.</p>');p.querySelectorAll('[data-event]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const id=btn.dataset.event;const r=joined.has(id)?await db.from('registrations').delete().eq('event_id',id).eq('user_id',user.id):await db.from('registrations').insert({event_id:id,user_id:user.id});if(r.error){msg(r.error.message);btn.disabled=false}else show('events')})}
const products=[['Essential Tee',55],['Running Cap',45],['Race Singlet',60],['Club Hoodie',95]];
async function show(tab){if(!user||recovering)return;msg('');$('address').textContent='/members/'+tab;const p=$('panel');if(tab==='home'||tab==='events'){p.innerHTML=(tab==='home'?'<div class="banner"><small>SYSTEM MESSAGE // 001</small><h2>Welcome to The Station.</h2>Built for those who show up.</div>':'')+'<h2>Upcoming sessions_</h2>';await events()}if(tab==='rank'){p.innerHTML='<h2>Station rankings_</h2>';const r=await db.from('leaderboard').select('*').order('points',{ascending:false});if($('address').textContent!='/members/rank')return;p.insertAdjacentHTML('beforeend',r.error?'<p>Leaderboard unavailable.</p>':r.data.map((x,i)=>`<div class="item">${i+1}. ${esc(x.display_name)} — ${esc(x.points)} points</div>`).join('')||'<p>No results yet.</p>')}if(tab==='profile'){p.innerHTML='<h2>Member file_</h2><div class="banner">MEMBER ACCESS GRANTED<p>'+esc(user.email)+'</p></div><form id="profileform"><label>Display name</label><input id="displayname" maxlength="60" required><p><button>Save profile</button></p></form>';const r=await db.from('profiles').select('display_name').eq('id',user.id).maybeSingle();if(!$('displayname'))return;$('displayname').value=r.data?.display_name||'';$('profileform').onsubmit=async e=>{e.preventDefault();const r=await db.from('profiles').upsert({id:user.id,display_name:$('displayname').value});msg(r.error?r.error.message:'Profile saved.')}}if(tab==='clothing'){p.innerHTML='<div class="banner"><h2>The Station. Uniform</h2>MEMBERS COLLECTION / VOL. 01</div><h2>Clothing directory_</h2><div class="products">'+products.map(([name,price],i)=>`<div class="product"><div class="art">The Station.</div><h3>${name}</h3><p>$${price} AUD</p><select aria-label="Size">${(i===1?['One size']:['S','M','L','XL']).map(s=>`<option>${s}</option>`).join('')}</select> <button data-add="${i}">Add to bag</button></div>`).join('')+'</div><h3>Shopping bag_</h3><div id="bag"></div><p>Concept products only. Checkout not connected.</p>';p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{bag.push({i:+b.dataset.add,size:b.previousElementSibling.value});renderBag()});renderBag()}}
function renderBag(){$('bag').innerHTML=bag.map((x,i)=>`<p>${products[x.i][0]} / ${esc(x.size)} — $${products[x.i][1]} <button data-remove="${i}">Remove</button></p>`).join('')+`<b>Total: $${bag.reduce((s,x)=>s+products[x.i][1],0)} AUD</b>`;$('bag').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{bag.splice(+b.dataset.remove,1);renderBag()})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
</script></html>
