</style><style>.champions{border:1px solid #33445e;border-radius:12px;padding:16px;margin:18px 0;background:radial-gradient(ellipse at 50% 40%,#14294b,#090e17 70%)}.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;text-align:center}.champion{min-width:0;overflow-wrap:anywhere}.champion img{width:100%;max-width:210px;display:block;margin:auto}.champion:not(.first) img{max-width:165px}.champion.first{color:#f5cf72}.champion.second{color:#d4dce8}.champion.third{color:#dc9c6c}.champion strong{display:block;font-size:clamp(12px,2vw,19px);margin:8px 0}.champion small{display:block;color:#aabbd3}.rankline{display:grid;grid-template-columns:36px 1fr auto;gap:8px;padding:12px 4px;border-top:1px solid #26364d}.champions h2{margin-top:0}.ranknumber{font:bold 20px monospace}.podium .empty{opacity:.45}@media(max-width:480px){.champions{padding:9px}.podium{gap:4px}.champion strong{font-size:12px}.champion small{font-size:10px}}</style><video class="background-video" id="backgroundVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="kettlebell.mp4" type="video/mp4"></video><button class="video-toggle" id="videoToggle" type="button">Pause background</button><script>const v=document.getElementById('backgroundVideo'),bt=document.getElementById('videoToggle');if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.pause();bt.hidden=true}bt.onclick=()=>{if(v.paused){v.play().then(()=>bt.textContent='Pause background').catch(()=>bt.textContent='Video unavailable')}else{v.pause();bt.textContent='Play background'}};v.addEventListener('error',()=>bt.hidden=true,true);</script><div class="window"><span id="address" hidden>/login</span><main><h1>Six Stations.</h1><div class="tag" id="tagline">TRAIN. CONNECT. COMPETE.</div><section id="auth"><form id="authform"><fieldset><legend id="legend">Member authentication</legend><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password" id="pwlabel">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><p><button id="submit">Log in →</button></p></fieldset><p><button type="button" data-mode="login">Log in</button> <button type="button" data-mode="signup">Register</button> <button type="button" data-mode="reset">Forgot password?</button></p></form></section><section id="members" hidden><nav><button data-tab="home">Home</button><button data-tab="events">Events</button><button data-tab="rank">Leaderboard</button><button data-tab="clothing">Clothing</button><button data-tab="profile">My Profile</button><button data-tab="admin" id="adminTab" hidden>Admin</button><button id="logout">Log out</button></nav><div id="panel"></div></section><p id="message" role="status"></p><footer>SIX STATIONS NETWORK © 2026</footer></main><div class="status">▣ Six Stations. / Member network</div></div><script type="module">

const db=createClient('https://rmcxwohdavmxwlgfmopy.supabase.co','sb_publishable_guh28en0UYS0aEg0Y52MTw_5f4_msCQ');
let products=[],settings={},admin=false,view=0;const $=id=>document.getElementById(id), msg=t=>$('message').textContent=t;let mode='login',user=null,recovering=false,bag=[];const redirect=location.origin+location.pathname;
function setMode(m){mode=m;$('legend').textContent={login:'Member authentication',signup:'Create member account',reset:'Password recovery',update:'Choose new password'}[m];$('submit').textContent={login:'Log in →',signup:'Register',reset:'Send reset email',update:'Save password'}[m];$('email').hidden=m==='update';$('email').required=m!=='update';$('password').hidden=$('pwlabel').hidden=m==='reset';$('password').required=m!=='reset';$('password').autocomplete=m==='login'?'current-password':'new-password';$('password').value='';}

async function events(){const p=$('panel');const [a,b]=await Promise.all([db.from('events').select('*').order('starts_at'),db.from('registrations').select('event_id').eq('user_id',user.id)]);if(a.error||b.error){p.insertAdjacentHTML('beforeend','<p>Events unavailable. Run the database setup SQL.</p>');return}const joined=new Set(b.data.map(x=>x.event_id));p.insertAdjacentHTML('beforeend',a.data.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.description)}</p><p>${esc(new Date(x.starts_at).toLocaleString())} · ${esc(x.location)}</p><button data-event="${esc(x.id)}">${joined.has(x.id)?'Cancel registration':'Join event'}</button></div>`).join('')||'<p>No upcoming events listed.</p>');p.querySelectorAll('[data-event]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const id=btn.dataset.event;const r=joined.has(id)?await db.from('registrations').delete().eq('event_id',id).eq('user_id',user.id):await db.from('registrations').insert({event_id:id,user_id:user.id});if(r.error){msg(r.error.message);btn.disabled=false}else show('events')})}

async function show(tab){if(!user||recovering)return;const token=++view;msg('');$('address').textContent='/members/'+tab;const p=$('panel');if(tab==='admin'){if(!admin){p.textContent='Access denied';return}return adminPanel()}if(tab==='home'||tab==='rank'){p.innerHTML='<div class="champions"><h2>Station champions_</h2><div id="rankingContent">Loading rankings…</div><button id="refreshRanks" type="button">Refresh rankings</button> <button id="pauseFigures" type="button">Pause figurines</button></div>'+(tab==='home'?'<div class="banner"><h2>Welcome to Six Stations.</h2>'+esc(settings.welcome||'Built for those who show up.')+'<p>'+esc(settings.announcement||'')+'</p></div>':'');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const render=async()=>{const r=await db.from('leaderboard').select('*').order('points',{ascending:false}).order('id');if(token!==view||!$('rankingContent'))return;if(r.error){$('rankingContent').textContent='Leaderboard unavailable: '+r.error.message;return}const rows=r.data;const figure=(i,cls)=>{const x=rows[i];return `<div class="champion ${cls} ${x?'':'empty'}"><div class="ranknumber">${i+1}</div><img data-figure="${i+1}" src="conductor-${i+1}${paused?'-still.png':'.gif'}" alt="Railway conductor figurine"><strong>${esc(x?.display_name||'Unclaimed')}</strong><small>${x?esc(x.points)+' points':'Awaiting results'}</small></div>`};$('rankingContent').innerHTML='<div class="podium">'+figure(1,'second')+figure(0,'first')+figure(2,'third')+'</div>'+rows.slice(3).map((x,i)=>`<div class="rankline"><span>${i+4}</span><span>${esc(x.display_name)}</span><span>${esc(x.points)} pts</span></div>`).join('')};$('refreshRanks').onclick=render;$('pauseFigures').textContent=paused?'Play figurines':'Pause figurines';$('pauseFigures').onclick=()=>{paused=!paused;$('pauseFigures').textContent=paused?'Play figurines':'Pause figurines';$('rankingContent').querySelectorAll('img').forEach(img=>img.src=`conductor-${img.dataset.figure}${paused?'-still.png':'.gif'}`)};await render()}if(tab==='events'){p.innerHTML='<h2>Upcoming sessions_</h2>';await events()}if(tab==='profile'){p.innerHTML='<h2>Member file_</h2><div class="banner">MEMBER ACCESS GRANTED<p>'+esc(user.email)+'</p></div><form id="profileform"><label>Display name</label><input id="displayname" maxlength="60" required><p><button>Save profile</button></p></form>';const r=await db.from('profiles').select('display_name').eq('id',user.id).maybeSingle();if(!$('displayname'))return;$('displayname').value=r.data?.display_name||'';$('profileform').onsubmit=async e=>{e.preventDefault();const r=await db.from('profiles').upsert({id:user.id,display_name:$('displayname').value});msg(r.error?r.error.message:'Profile saved.')}}if(tab==='clothing'){p.textContent='Loading clothing…';const r=await db.from('products').select('*').order('name');if(token!==view)return;if(r.error){p.textContent=r.error.message;return}products=r.data;p.innerHTML='<div class="banner"><h2>Six Stations. Uniform</h2>MEMBERS COLLECTION / VOL. 01</div><h2>Clothing directory_</h2><div class="products">'+products.map(x=>`<div class="product">${safeUrl(x.image_url)?`<img style="width:100%;height:150px;object-fit:cover" src="${esc(safeUrl(x.image_url))}" alt="${esc(x.name)}">`:'<div class="art">Six Stations.</div>'}<h3>${esc(x.name)}</h3><p>$${esc(x.price)} AUD · ${esc(x.stock)} in stock</p><select aria-label="Size">${esc(x.sizes).split(',').map(z=>`<option>${z.trim()}</option>`).join('')}</select> <button data-add="${esc(x.id)}" ${x.stock<=0?'disabled':''}>Add to bag</button></div>`).join('')+'</div><h3>Shopping bag_</h3><div id="bag"></div><p>Checkout not connected.</p>';p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const x=products.find(z=>z.id===b.dataset.add);if(x&&bag.filter(z=>z.id===x.id).length<x.stock){bag.push({id:x.id,name:x.name,price:Number(x.price),size:b.previousElementSibling.value});renderBag()}});renderBag()}}
function renderBag(){ $('bag').innerHTML=bag.map((x,i)=>`<p>${esc(x.name)} / ${esc(x.size)} — $${esc(x.price)} <button data-remove="${i}">Remove</button></p>`).join('')+`<b>Total: $${bag.reduce((s,x)=>s+x.price,0).toFixed(2)} AUD</b>`;$('bag').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{bag.splice(+b.dataset.remove,1);renderBag()})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));

it(rows[0]||{id:1});$('newEntry').hidden=true}else{$('editList').innerHTML=rows.map((x,i)=>`<div class="item"><b>${esc(x.title||x.name||x.display_name)}</b> <button data-edit="${i}">Edit</button> <button data-delete="${i}">Delete</button></div>`).join('');$('editList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(rows[+b.dataset.edit]));$('editList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this entry? Event deletion also removes registrations.'))return;const q=await db.from(t).delete().eq('id',rows[+b.dataset.delete].id);if(q.error)msg(q.error.message);else adminPanel()});$('newEntry').onclick=()=>edit(null);edit(null)}form.onsubmit=async e=>{e.preventDefault();const data={};for(const [k,l,type] of fields){let val=$('field_'+k).value;if(type==='number')val=Number(val);if(type==='datetime-local')val=new Date(val).toISOString();data[k]=val}if(data.video_url&&!safeUrl(data.video_url)){msg('Use a valid HTTPS video URL or local filename.');return}const q=editing!==null?await db.from(t).update(data).eq('id',editing):await db.from(t).insert(data);if(q.error){msg(q.error.message);return}if(t==='site_settings')await loadSettings();msg('Saved successfully.');adminPanel()}}
